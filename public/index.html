<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">

    <title>TaskFlow — Gestor de tarefas</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <header class="hero">
        <div class="hero-conteudo">
            <div class="marca">
                <span class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
                </span>

                <div>
                    <h1>TaskFlow</h1>
                    <p class="subtitulo">Organiza o teu trabalho, uma tarefa de cada vez.</p>
                </div>
            </div>

            <a class="link-dashboard" href="/dashboard">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
                Monitorização
            </a>
        </div>
    </header>

    <main>
        <section class="resumo" aria-label="Resumo das tarefas">
            <div class="contador contador-total">
                <span class="contador-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
                </span>
                <span class="contador-valor" id="total">0</span>
                <span class="contador-nome">Total</span>
            </div>

            <div class="contador contador-pendentes">
                <span class="contador-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                </span>
                <span class="contador-valor" id="pendentes">0</span>
                <span class="contador-nome">Por fazer</span>
            </div>

            <div class="contador contador-concluidas">
                <span class="contador-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
                </span>
                <span class="contador-valor" id="concluidas">0</span>
                <span class="contador-nome">Concluídas</span>
            </div>

            <div class="contador progresso">
                <div class="progresso-topo">
                    <label for="barra-progresso">Progresso</label>
                    <span id="percentagem">0%</span>
                </div>
                <progress id="barra-progresso" max="1" value="0"></progress>
                <span class="progresso-texto" id="progresso-texto">Sem tarefas ainda</span>
            </div>
        </section>

        <section class="cartao">
            <form id="f" class="nova-tarefa" novalidate>
                <label for="title">Nova tarefa</label>

                <div class="linha-formulario">
                    <input
                        id="title"
                        maxlength="120"
                        required
                        autocomplete="off"
                        placeholder="O que precisas de fazer?"
                        aria-describedby="caracteres"
                    >

                    <button type="submit" id="adicionar" class="botao-adicionar">
                        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                        Adicionar
                    </button>
                </div>

                <small id="caracteres">0/120</small>
            </form>

            <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

            <div class="barra-lista">
                <h2>As tuas tarefas</h2>

                <div class="filtros" role="group" aria-label="Filtrar tarefas">
                    <button type="button" class="filtro" data-filtro="todas" aria-pressed="true">Todas</button>
                    <button type="button" class="filtro" data-filtro="pendentes" aria-pressed="false">Por fazer</button>
                    <button type="button" class="filtro" data-filtro="concluidas" aria-pressed="false">Concluídas</button>
                </div>
            </div>

            <ul id="list" class="lista" aria-label="Lista de tarefas"></ul>

            <div id="vazio" class="vazio" hidden>
                <svg aria-hidden="true" viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="10" width="40" height="46" rx="6"/><path d="M24 10V6h16v4M22 26h20M22 34h20M22 42h12"/></svg>
                <p id="vazio-texto"></p>
            </div>
        </section>
    </main>

    <footer class="rodape">
        TaskFlow-XOps · Plataformas e Serviços X-Ops · UBI 2026/27
    </footer>

    <script src="/app.js"></script>
</body>

</html>
