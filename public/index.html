
<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>TaskFlow — Sprint 1</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>TaskFlow</h1>

        <p>Gestor de tarefas — protótipo demonstrável do Sprint 1.</p>

        <form id="f">
            <input
                id="title"
                maxlength="120"
                required
                placeholder="Escreve uma tarefa"
            >

            <button>Adicionar</button>
        </form>

        <ul id="list"></ul>
    </main>

    <script>
        const list = document.getElementById('list');
        const input = document.getElementById('title');

        async function refresh() {
            const tasks = await (await fetch('/api/tasks')).json();

            list.replaceChildren();

            for (const t of tasks) {
                const li = document.createElement('li');

                if (t.done) {
                    li.className = 'done';
                }

                const span = document.createElement('span');
                span.textContent = t.title;

                const b = document.createElement('button');
                b.textContent = t.done ? 'Reabrir' : 'Concluir';

                b.onclick = async () => {
                    await fetch('/api/tasks/' + t.id + '/toggle', {
                        method: 'PATCH'
                    });

                    refresh();
                };

                li.append(span, b);
                list.append(li);
            }
        }

        document.getElementById('f').onsubmit = async (e) => {
            e.preventDefault();

            const r = await fetch('/api/tasks', {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    title: input.value
                })
            });

            if (r.ok) {
                input.value = '';
                refresh();
            } else {
                alert('Não foi possível adicionar a tarefa');
            }
        };
        
        input.addEventListener('invalid', function () {
            this.setCustomValidity('Por favor, escreve uma tarefa antes de adicionar.');
        });

        input.addEventListener('input', function () {
            this.setCustomValidity('');
        });

        refresh();
    </script>
</body>

</html>
