name: TaskFlow CI - Sprint 2

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe
        run: npm run check

      - name: Executar testes automáticos
        run: npm test

      - name: Análise estática de segurança SAST
        run: npm run security