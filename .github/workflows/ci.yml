
name: TaskFlow CI/CD

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter codigo
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxe
        run: npm run check

      - name: Executar testes automaticos
        run: npm test

      - name: Analise estatica de seguranca SAST
        run: npm run security

      - name: Instalar e iniciar Ollama
        # Versao fixa para a analise ser reprodutivel: sem isto, o script
        # instala sempre a versao mais recente. A v0.40.17 (20/11/2026)
        # coincidiu com falhas "length" do AI Gate sem alteracoes ao codigo;
        # a v0.40.16 foi a usada no ultimo run verde (run #18).
        env:
          OLLAMA_VERSION: '0.40.16'
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="$OLLAMA_VERSION" sh

          VERSAO_INSTALADA=$(ollama --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
          echo "Ollama instalado: $VERSAO_INSTALADA (esperado: $OLLAMA_VERSION)"
          if [ "$VERSAO_INSTALADA" != "$OLLAMA_VERSION" ]; then
            echo "Erro: versao do Ollama diferente da fixada"
            exit 1
          fi

          # Hardware do runner: modelos locais podem dar respostas diferentes
          # em processadores diferentes, mesmo com temperatura 0 e seed fixa.
          echo "CPU: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p')"
          echo "Nucleos: $(nproc)"
          echo "Instrucoes vetoriais: $(grep -o -w -E 'avx|avx2|avx512f|avx512_vnni|avx_vnni' /proc/cpuinfo | sort -u | tr '\n' ' ')"

          sudo systemctl start ollama

          for tentativa in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama pronto"
              exit 0
            fi
            sleep 2
          done

          echo "Erro: Ollama nao iniciou"
          sudo systemctl status ollama --no-pager || true
          exit 1

      - name: Descarregar modelo de IA
        run: ollama pull qwen2.5-coder:1.5b

      - name: Executar AI Gate
        run: npm run ai-review

      - name: Guardar relatorio da IA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-ai-review
          path: reports/ai-review.json
          if-no-files-found: warn

  dast:
    # Testes dinamicos de seguranca (DAST) contra uma instancia temporaria
    # do TaskFlow, criada apenas dentro deste job do GitHub Actions.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PORT: '3000'
      DAST_TARGET: http://localhost:3000

    steps:
      - name: Obter codigo
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar token temporario de monitorizacao
        # Token aleatorio por execucao: nao fica no repositorio nem nos logs.
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          echo "METRICS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Iniciar instancia temporaria do TaskFlow
        run: |
          mkdir -p reports
          # Arranca o node diretamente para o PID guardado ser o do servidor.
          nohup node src/server.js > reports/dast-server.log 2>&1 &
          echo $! > reports/dast-server.pid

      - name: Aguardar que o TaskFlow esteja operacional
        run: |
          for tentativa in $(seq 1 30); do
            if curl -fsS "$DAST_TARGET/api/health" > /dev/null; then
              echo "TaskFlow pronto em $DAST_TARGET"
              exit 0
            fi
            sleep 1
          done

          echo "Erro: o TaskFlow nao iniciou"
          cat reports/dast-server.log || true
          exit 1

      - name: Verificar estado da instancia
        # Confirma que o alvo responde como esperado antes do scan.
        run: |
          curl -fsS "$DAST_TARGET/api/health"
          echo
          curl -fsS -o /dev/null -w "Pagina inicial: HTTP %{http_code}\n" "$DAST_TARGET/"
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" "$DAST_TARGET/api/metrics")
          echo "/api/metrics sem token: HTTP $CODIGO"
          test "$CODIGO" = "401"

      - name: OWASP ZAP Baseline Scan (passivo)
        # Analise passiva: o spider percorre as paginas e o ZAP analisa as
        # respostas, sem ataques ativos e sem alterar dados.
        # Criterio: qualquer aviso (WARN) ou falha (FAIL) que nao esteja
        # marcado como IGNORE em config/zap-rules.tsv faz falhar a pipeline.
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.DAST_TARGET }}
          rules_file_name: config/zap-rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: taskflow-zap-report

      - name: Parar instancia temporaria do TaskFlow
        if: always()
        run: |
          if [ -f reports/dast-server.pid ]; then
            kill "$(cat reports/dast-server.pid)" 2>/dev/null || true
          fi

      - name: Guardar log do servidor DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-dast-server-log
          path: reports/dast-server.log
          if-no-files-found: warn

  docker:
    # Build e teste da imagem Docker da aplicação (S5-2).
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter codigo
        uses: actions/checkout@v5

      - name: Construir imagem
        run: docker build -t taskflow-xops:ci .

      - name: Arrancar contentor com token temporario
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          echo "METRICS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          docker run -d --name taskflow -p 3000:3000 -e METRICS_TOKEN="$TOKEN" taskflow-xops:ci

      - name: Testar contentor
        run: |
          for tentativa in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:3000/api/health
          echo

          SEM_TOKEN=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/metrics)
          COM_TOKEN=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $METRICS_TOKEN" http://localhost:3000/api/metrics)
          echo "/api/metrics sem token: HTTP $SEM_TOKEN | com token: HTTP $COM_TOKEN"
          test "$SEM_TOKEN" = "401"
          test "$COM_TOKEN" = "200"

          # O HEALTHCHECK da imagem tem de chegar a "healthy".
          for tentativa in $(seq 1 20); do
            ESTADO=$(docker inspect taskflow --format '{{.State.Health.Status}}')
            if [ "$ESTADO" = "healthy" ]; then
              echo "HEALTHCHECK: $ESTADO"
              exit 0
            fi
            sleep 2
          done

          echo "Erro: HEALTHCHECK em estado $ESTADO"
          exit 1

      - name: Utilizador e tamanho da imagem
        run: |
          echo "Utilizador: $(docker run --rm --entrypoint whoami taskflow-xops:ci)"
          docker image ls taskflow-xops:ci --format 'Tamanho: {{.Size}}'

      - name: Log do contentor
        if: always()
        run: docker logs taskflow || true

  publish:
    # Entrega contínua: publica a imagem no GitHub Container Registry,
    # só em push para a main e só se todos os gates passarem.
    needs: [quality, dast, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Obter codigo
        uses: actions/checkout@v5

      - name: Definir nome da imagem
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Autenticar no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construir e publicar imagem
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGEM:${GITHUB_SHA::7}" \
            -t "$IMAGEM:latest" \
            .
          docker push "$IMAGEM:${GITHUB_SHA::7}"
          docker push "$IMAGEM:latest"
          echo "Publicado: $IMAGEM:${GITHUB_SHA::7} e $IMAGEM:latest"
